spring.application.name=library-manager
server.port=8080

# --- PostgreSQL ---

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lbm_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=postgres123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT ---
app.jwt.secret=${JWT_SECRET:bGlic29mdC1saWJyYXJ5LW1hbmFnZXItc2VjcmV0LWtleS0yMDI2LXZlcnktbG9uZy1rZXk=}
app.jwt.expiration-ms=86400000

# --- Mail (envoi à l'admin après registration) ---
app.mail.admin=${ADMIN_EMAIL:admin@lbm.com}
app.mail.from=${MAIL_FROM:no-reply@lbm.com}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Admin par défaut ---
app.admin.default-email=${ADMIN_EMAIL:admin@lbm.com}
app.admin.default-password=${ADMIN_PASSWORD:Admin@123}

# --- Upload images de couverture ---
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
